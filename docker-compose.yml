# ============================================================================
# Izy'Ah — full stack. `docker compose up --build` boots everything.
#
#   User ──► Traefik ──► Frontend (nginx, static Vue build)
#                   └──► Backend  (Express REST + Socket.IO)
#
#   Backend ──► PostgreSQL, Redis, MinIO
#
# For local dev with hot reload run only the infra profile and start the apps
# natively (see README):  docker compose -f docker-compose.dev.yml up
# ============================================================================

networks:
  izyah:
    name: izyah

volumes:
  postgres-data:
  redis-data:
  minio-data:

services:
  # --------------------------------------------------------------------------
  # Reverse proxy
  # --------------------------------------------------------------------------
  traefik:
    # Must be v3.6.1+: earlier v3 tags pin Docker API 1.24, which Docker Engine
    # 28+ refuses ("client version 1.24 is too old"). The provider then loops on
    # errors and discovers NO routers, so every request 404s while the app
    # itself looks perfectly healthy. Keep this in sync with the pin in
    # setup.sh's generated docker-compose.prod.yml — a mismatch means anyone
    # who recreates traefik without that overlay silently breaks all routing.
    image: traefik:v3.6.1
    container_name: izyah-traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_DOMAIN}`)
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls=true
      - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.dashboard.middlewares=admin-auth@docker
      # HTTP Basic Auth for the dashboard + Adminer (see the adminer service
      # below). ADMIN_AUTH_HTPASSWD is generated by setup.sh — a single
      # "user:apr1-hash" pair, never a plaintext password.
      - traefik.http.middlewares.admin-auth.basicauth.users=${ADMIN_AUTH_HTPASSWD}
    networks:
      - izyah

  # --------------------------------------------------------------------------
  # Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: izyah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - izyah

  # --------------------------------------------------------------------------
  # Cache / pub-sub / queues
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: izyah-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - izyah

  # --------------------------------------------------------------------------
  # Object storage (S3 compatible)
  # --------------------------------------------------------------------------
  minio:
    # Digest-pinned to the image production is already running (verified on the
    # box 2026-07-26), so a recreate can never silently swap the version out
    # from under an existing data volume. `:latest` gave no such guarantee: a
    # traefik container recreated onto a tag the files no longer described is
    # exactly what caused a routing outage. Re-pin deliberately with:
    #   docker pull minio/minio:RELEASE.<x> && \
    #     docker image inspect minio/minio:RELEASE.<x> --format '{{index .RepoDigests 0}}'
    # and read MinIO's release notes first — a server upgrade is a one-way door
    # for the volume format.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e  # RELEASE.2025-09-07T16-13-09Z
    container_name: izyah-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      # Browser access to objects (S3 API) at minio.izyah.localhost
      - traefik.http.routers.minio.rule=Host(`${MINIO_CONSOLE_DOMAIN}`)
      - traefik.http.routers.minio.entrypoints=web
      - traefik.http.services.minio.loadbalancer.server.port=9000
    networks:
      - izyah

  # One-shot: create buckets + set public-read policy on media.
  minio-init:
    # Pinned for the same reason as minio above; stateless, so this one is only
    # about reproducibility, not data safety.
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727  # mc 9.6
    container_name: izyah-storage-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_MEDIA: ${MINIO_BUCKET_MEDIA}
      MINIO_BUCKET_AVATARS: ${MINIO_BUCKET_AVATARS}
    entrypoint: ["/bin/sh", "/create-buckets.sh"]
    volumes:
      - ./infra/minio/create-buckets.sh:/create-buckets.sh:ro
    networks:
      - izyah

  # --------------------------------------------------------------------------
  # Database administration tool
  # --------------------------------------------------------------------------
  adminer:
    # Stateless, but pinned anyway: this sits in front of the production
    # database, so the image reaching it should never change without a commit.
    # The image publishes no version label — digest captured from the running
    # production container on 2026-07-26.
    image: adminer@sha256:494d4a9461105644222c938679fe58d5e3fd13fb228c76a426e81c16d4ffbaef
    container_name: izyah-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.adminer.rule=Host(`${ADMINER_DOMAIN}`)
      - traefik.http.routers.adminer.entrypoints=web
      - traefik.http.routers.adminer.middlewares=admin-auth@docker
      - traefik.http.services.adminer.loadbalancer.server.port=8080
    networks:
      - izyah

  # --------------------------------------------------------------------------
  # Identity provider (OIDC) — account-linking / recovery / cross-device.
  # Anonymous-first still works without it; Logto is only hit when a user
  # chooses to "claim" their identity. See SETUP-AUTH.md for provisioning.
  # --------------------------------------------------------------------------
  logto:
    # Digest-pinned: Logto owns its own schema in the `logto` database and the
    # entrypoint runs `cli db seed` on every start, so an unplanned version jump
    # would migrate that schema unasked. See minio above for how to re-pin.
    image: svhd/logto@sha256:7f79547e3d1fe569a3ecae757968a7cfc579687aa8164eec35113c0adc983c5b  # 1.41.0
    container_name: izyah-logto
    restart: unless-stopped
    # Dormant until M2: only starts with `--profile auth`, so a normal
    # `up` / setup.sh / CI deploy never touches it.
    profiles: ["auth"]
    # Seed/upgrade the Logto schema (idempotent) then start.
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    environment:
      TRUST_PROXY_HEADER: 1
      DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/logto
      ENDPOINT: https://${AUTH_DOMAIN}
      ADMIN_ENDPOINT: https://${AUTH_ADMIN_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true

      # Public OIDC
      - traefik.http.routers.logto.rule=Host(`${AUTH_DOMAIN}`)
      - traefik.http.routers.logto.entrypoints=websecure
      - traefik.http.routers.logto.tls=true
      - traefik.http.routers.logto.tls.certresolver=letsencrypt
      - traefik.http.routers.logto.service=logto
      - traefik.http.services.logto.loadbalancer.server.port=3001

      # Admin
      - traefik.http.routers.logto-admin.rule=Host(`${AUTH_ADMIN_DOMAIN}`)
      - traefik.http.routers.logto-admin.entrypoints=websecure
      - traefik.http.routers.logto-admin.tls=true
      - traefik.http.routers.logto-admin.tls.certresolver=letsencrypt
      - traefik.http.routers.logto-admin.service=logto-admin
      - traefik.http.services.logto-admin.loadbalancer.server.port=3002
    networks:
      - izyah

  # --------------------------------------------------------------------------
  # Backend API (Express REST + Socket.IO)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: izyah-backend
    container_name: izyah-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      SEED_ON_START: ${SEED_ON_START}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      LOG_LEVEL: ${LOG_LEVEL}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_MEDIA: ${MINIO_BUCKET_MEDIA}
      MINIO_BUCKET_AVATARS: ${MINIO_BUCKET_AVATARS}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      RUN_WORKER_INLINE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`${API_DOMAIN}`)
      - traefik.http.services.backend.loadbalancer.server.port=4000
      # Socket.IO needs sticky sessions once you scale to >1 replica.
      - traefik.http.services.backend.loadbalancer.sticky.cookie=true
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls=true
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
    networks:
      - izyah

  # --------------------------------------------------------------------------
  # Frontend (static Vue build, served by nginx)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL}
        VITE_OIDC_ISSUER: ${OIDC_ISSUER}
        VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
    image: izyah-frontend
    container_name: izyah-frontend
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.services.frontend.loadbalancer.server.port=80
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
    networks:
      - izyah

  # --------------------------------------------------------------------------
  # Periodic backups (Postgres + Redis + MinIO + .env) — node-cron scheduler.
  # Talks to postgres/redis/minio over this network as an ordinary client
  # (pg_dumpall, redis-cli, mc) — deliberately no Docker socket mount here.
  # See scripts/backup.sh and scripts/backup-cron.js.
  # --------------------------------------------------------------------------
  backup:
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    image: izyah-backup
    container_name: izyah-backup-cron
    restart: unless-stopped
    environment:
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-}
    volumes:
      - ./.env:/app/.env:ro
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - izyah
