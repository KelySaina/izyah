# ============================================================================
# Izy'Ah — full stack. `docker compose up --build` boots everything.
#
#   User ──► Caddy (on the host) ──► Frontend (nginx, static Vue build)
#                                └──► Backend  (Express REST + Socket.IO)
#
#   Backend ──► PostgreSQL, Redis, MinIO
#
# This stack no longer ships a reverse proxy. Traefik used to live here and bind
# 80/443, which made it impossible to run alongside anything else on the box that
# wanted those ports. Routing and TLS are now a Caddy running on the host, shared
# with every other app there; this file only publishes each service on loopback
# for it to reach. See infra/caddy/izyah.caddyfile and scripts/caddy-site.sh.
#
# For local dev with hot reload run only the infra profile and start the apps
# natively (see README):  docker compose -f docker-compose.dev.yml up
# ============================================================================

networks:
  izyah:
    name: izyah

volumes:
  postgres-data:
  redis-data:
  minio-data:

services:
  # --------------------------------------------------------------------------
  # Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: izyah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - izyah

  # --------------------------------------------------------------------------
  # Cache / pub-sub / queues
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: izyah-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - izyah

  # --------------------------------------------------------------------------
  # Object storage (S3 compatible)
  # --------------------------------------------------------------------------
  minio:
    # MinIO deleted minio/minio and minio/mc from Docker Hub in September 2026 and
    # stopped serving them anonymously from quay.io days later. A digest pin does not
    # survive that: the repository is gone, so the old digest answers "denied" exactly
    # like the tag did. This is Chainguard's free source-built image of the same AGPL
    # server, which still publishes publicly.
    #
    # Still digest-pinned, for the original reason — a recreate must never silently
    # swap the version out from under an existing data volume — but now also because
    # the free tier carries no version tags at all, only :latest. Re-pin deliberately:
    #   docker pull cgr.dev/chainguard/minio:latest && \
    #     docker image inspect cgr.dev/chainguard/minio:latest --format '{{index .RepoDigests 0}}'
    # and read the release notes first: a server upgrade is a one-way door for the
    # volume format. The digest is an OCI index covering linux/amd64 and linux/arm64.
    #
    # NOTE: this image runs as uid 65532, where MinIO's own ran as root. A volume that
    # already holds objects stays root-owned and the server exits with "drive may be
    # faulty" instead of a permission error. With the stack down, once:
    #   docker run --rm -v izyah_minio-data:/d alpine chown -R 65532:65532 /d
    image: cgr.dev/chainguard/minio@sha256:a05a4497e8dce3cb7a7a1bf1872ba5d30ea988f1e8c22c9e0920503761c4b5f1
    container_name: izyah-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Published on loopback only: the reverse proxy is a Caddy on the host, outside
    # docker, so it cannot reach this over the compose network and needs a port — but
    # ${HOST_BIND} keeps it off every other interface, so the proxy stays the only
    # way in. Never set HOST_BIND to 0.0.0.0 on a public box: that serves the app in
    # plain http alongside the TLS you set up, which is worse than not setting it up.
    ports:
      - "${HOST_BIND:-127.0.0.1}:${MINIO_HOST_PORT:-4313}:9000"
      - "${HOST_BIND:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-4314}:9001"
    networks:
      - izyah

  # One-shot: create buckets + set public-read policy on media.
  minio-init:
    # The same image as the server above, not a separate client one: it carries both
    # `mc` and a shell, where Chainguard's minio-client is distroless and would leave
    # the /bin/sh entrypoint below nothing to run. One image, one digest to bump.
    image: cgr.dev/chainguard/minio@sha256:a05a4497e8dce3cb7a7a1bf1872ba5d30ea988f1e8c22c9e0920503761c4b5f1
    container_name: izyah-storage-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_MEDIA: ${MINIO_BUCKET_MEDIA}
      MINIO_BUCKET_AVATARS: ${MINIO_BUCKET_AVATARS}
    entrypoint: ["/bin/sh", "/create-buckets.sh"]
    volumes:
      - ./infra/minio/create-buckets.sh:/create-buckets.sh:ro
    networks:
      - izyah

  # --------------------------------------------------------------------------
  # Database administration tool
  # --------------------------------------------------------------------------
  adminer:
    # Stateless, but pinned anyway: this sits in front of the production
    # database, so the image reaching it should never change without a commit.
    # The image publishes no version label — digest captured from the running
    # production container on 2026-07-26.
    image: adminer@sha256:494d4a9461105644222c938679fe58d5e3fd13fb228c76a426e81c16d4ffbaef
    container_name: izyah-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy
    # Published on loopback only: the reverse proxy is a Caddy on the host, outside
    # docker, so it cannot reach this over the compose network and needs a port — but
    # ${HOST_BIND} keeps it off every other interface, so the proxy stays the only
    # way in. Never set HOST_BIND to 0.0.0.0 on a public box: that serves the app in
    # plain http alongside the TLS you set up, which is worse than not setting it up.
    ports:
      - "${HOST_BIND:-127.0.0.1}:${ADMINER_HOST_PORT:-4312}:8080"
    networks:
      - izyah

  # --------------------------------------------------------------------------
  # Identity provider (OIDC) — account-linking / recovery / cross-device.
  # Anonymous-first still works without it; Logto is only hit when a user
  # chooses to "claim" their identity. See SETUP-AUTH.md for provisioning.
  # --------------------------------------------------------------------------
  logto:
    # Digest-pinned: Logto owns its own schema in the `logto` database and the
    # entrypoint runs `cli db seed` on every start, so an unplanned version jump
    # would migrate that schema unasked. See minio above for how to re-pin.
    image: svhd/logto@sha256:7f79547e3d1fe569a3ecae757968a7cfc579687aa8164eec35113c0adc983c5b  # 1.41.0
    container_name: izyah-logto
    restart: unless-stopped
    # Dormant until M2: only starts with `--profile auth`, so a normal
    # `up` / setup.sh / CI deploy never touches it.
    profiles: ["auth"]
    # Seed/upgrade the Logto schema (idempotent) then start.
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    environment:
      TRUST_PROXY_HEADER: 1
      DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/logto
      ENDPOINT: https://${AUTH_DOMAIN}
      ADMIN_ENDPOINT: https://${AUTH_ADMIN_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    # Published on loopback only: the reverse proxy is a Caddy on the host, outside
    # docker, so it cannot reach this over the compose network and needs a port — but
    # ${HOST_BIND} keeps it off every other interface, so the proxy stays the only
    # way in. Never set HOST_BIND to 0.0.0.0 on a public box: that serves the app in
    # plain http alongside the TLS you set up, which is worse than not setting it up.
    ports:
      - "${HOST_BIND:-127.0.0.1}:${AUTH_HOST_PORT:-4315}:3001"
      - "${HOST_BIND:-127.0.0.1}:${AUTH_ADMIN_HOST_PORT:-4316}:3002"
    networks:
      - izyah

  # --------------------------------------------------------------------------
  # Backend API (Express REST + Socket.IO)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: izyah-backend
    container_name: izyah-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      SEED_ON_START: ${SEED_ON_START}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      LOG_LEVEL: ${LOG_LEVEL}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_MEDIA: ${MINIO_BUCKET_MEDIA}
      MINIO_BUCKET_AVATARS: ${MINIO_BUCKET_AVATARS}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      RUN_WORKER_INLINE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Published on loopback only: the reverse proxy is a Caddy on the host, outside
    # docker, so it cannot reach this over the compose network and needs a port — but
    # ${HOST_BIND} keeps it off every other interface, so the proxy stays the only
    # way in. Never set HOST_BIND to 0.0.0.0 on a public box: that serves the app in
    # plain http alongside the TLS you set up, which is worse than not setting it up.
    ports:
      - "${HOST_BIND:-127.0.0.1}:${BACKEND_HOST_PORT:-4311}:${BACKEND_PORT:-4000}"
    networks:
      - izyah

  # --------------------------------------------------------------------------
  # Frontend (static Vue build, served by nginx)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL}
        VITE_OIDC_ISSUER: ${OIDC_ISSUER}
        VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
    image: izyah-frontend
    container_name: izyah-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Published on loopback only: the reverse proxy is a Caddy on the host, outside
    # docker, so it cannot reach this over the compose network and needs a port — but
    # ${HOST_BIND} keeps it off every other interface, so the proxy stays the only
    # way in. Never set HOST_BIND to 0.0.0.0 on a public box: that serves the app in
    # plain http alongside the TLS you set up, which is worse than not setting it up.
    ports:
      - "${HOST_BIND:-127.0.0.1}:${FRONTEND_HOST_PORT:-4310}:80"
    networks:
      - izyah

  # --------------------------------------------------------------------------
  # Periodic backups (Postgres + Redis + MinIO + .env) — node-cron scheduler.
  # Talks to postgres/redis/minio over this network as an ordinary client
  # (pg_dumpall, redis-cli, mc) — deliberately no Docker socket mount here.
  # See scripts/backup.sh and scripts/backup-cron.js.
  # --------------------------------------------------------------------------
  backup:
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    image: izyah-backup
    container_name: izyah-backup-cron
    restart: unless-stopped
    environment:
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-}
    volumes:
      - ./.env:/app/.env:ro
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - izyah
