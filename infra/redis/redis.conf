# Izy'Ah Redis configuration.
# Used as: Socket.IO adapter (pub/sub), cache, rate-limit store, BullMQ broker.

# Persistence: AOF for durability of queue/job state.
appendonly yes
appendfsync everysec

# Snapshotting as a secondary safety net.
save 900 1
save 300 10
save 60 10000

# Memory policy. BullMQ + cache: evict volatile keys under pressure but keep
# keys without a TTL (jobs) as long as possible.
maxmemory-policy noeviction

# Networking: only reachable on the internal docker network.
bind 0.0.0.0
protected-mode no

# Reasonable defaults.
tcp-keepalive 300
timeout 0
