# Traefik v3 static configuration.
# HTTPS is wired but disabled for local dev. To enable in production, uncomment
# the certificatesResolvers block and add the router labels shown in the README.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: false # dashboard is exposed via a Host-rule router (see compose)

log:
  level: INFO

accessLog: {}

entryPoints:
  web:
    address: ":80"
    # In production, redirect everything to HTTPS:
    # http:
    #   redirections:
    #     entryPoint:
    #       to: websecure
    #       scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: izyah
    watch: true
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

# --- Production TLS (Let's Encrypt) — uncomment and set an email ------------
# certificatesResolvers:
#   letsencrypt:
#     acme:
#       email: you@example.com
#       storage: /letsencrypt/acme.json
#       httpChallenge:
#         entryPoint: web
