server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip for text assets.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Long-cache fingerprinted assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Never cache the service worker or manifest aggressively.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types { } default_type application/manifest+json;
  }

  # The app shell must always be revalidated. If a stale index.html is served
  # it references old hashed chunks that a new deploy has already removed, and
  # every lazy route (e.g. Create event) then fails to load — fresh in a hard-
  # refreshed browser, broken in a cached tab or installed PWA. no-cache keeps
  # the immutable /assets/ hashing intact while guaranteeing the shell is fresh.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
